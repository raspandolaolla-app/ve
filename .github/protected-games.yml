version: "1.0.0"
updated_at: "2026-09-10T15:35:00Z"
default_policy: STRICT_PROTECTION

allowed_states:
  - ACTIVE       # Juego en desarrollo. Puede modificarse.
  - CAUTION      # Juego funcional pero que comparte componentes sensibles.
  - STABLE       # Juego validado. No debe modificarse innecesariamente.
  - LOCKED       # Juego protegido contra cambios normales.
  - HARD_LOCKED  # Protección reforzada mediante controles Git/GitHub/CODEOWNERS.
  - UNDER_REPAIR # Desbloqueado explícitamente para reparación autorizada.

shared_infrastructure:
  - id: GameContainer
    path: src/features/games/components/GameContainer.tsx
    risk_level: CRITICAL
    description: Contenedor maestro de ciclo de vida, turnos, timers, rendición y liquidación
  - id: TurnTimer
    path: src/features/games/components/TurnTimer.tsx
    risk_level: CRITICAL
    description: Temporizador sincronizado server-authoritative con período de gracia y prevención de deadlocks
  - id: PlayerIdentityCard
    path: src/features/games/components/PlayerIdentityCard.tsx
    risk_level: HIGH
    description: Tarjeta de identidad visual y avatar de jugadores en mesa
  - id: PlayerLives
    path: src/features/games/components/PlayerLives.tsx
    risk_level: MEDIUM
    description: Indicador de vidas / fallas en juegos de eliminatoria
  - id: SettlementModal
    path: src/features/games/components/SettlementModal.tsx
    risk_level: HIGH
    description: Modal de premiación y resumen financiero final
  - id: GameArena
    path: src/features/games/GameArena.tsx
    risk_level: CRITICAL
    description: Enrutador maestro de renderizado según tipo de juego y mesa
  - id: useGameEngine
    path: src/features/games/useGameEngine.ts
    risk_level: CRITICAL
    description: Hook unificado de inicialización de motor, dispatch de jugadas y suscripción realtime
  - id: GameEngineBase
    path: src/features/games/engines/GameEngine.ts
    risk_level: CRITICAL
    description: Clase base abstracta de todos los motores de juego
  - id: GameEngineRegistry
    path: src/features/games/engines/index.ts
    risk_level: CRITICAL
    description: Fábrica y registro de instanciación de motores
  - id: GameStateGuard
    path: src/features/games/utils/gameStateGuard.ts
    risk_level: CRITICAL
    description: Validadores de contratos y esquemas JSONB de estado de juego
  - id: GameRepository
    path: src/services/repositories/GameRepository.ts
    risk_level: MAXIMUM
    description: Repositorio central de sesiones, turnos, timeouts, RPCs y jugadas server-authoritative
  - id: TableRepository
    path: src/services/repositories/TableRepository.ts
    risk_level: MAXIMUM
    description: Repositorio de creación de mesas, asientos únicos, uniones y abandonos
  - id: FinancialRepository
    path: src/services/repositories/FinancialRepository.ts
    risk_level: MAXIMUM
    description: Módulo financiero crítico: saldo disponible/retenido, ledger y transacciones
  - id: RealtimeManager
    path: src/services/realtime/RealtimeManager.ts
    risk_level: MAXIMUM
    description: Gestor de canales Supabase Realtime, presencia, reconexión y deduplicación
  - id: PresenceService
    path: src/services/PresenceService.ts
    risk_level: HIGH
    description: Servicio de latidos y estado en línea de usuarios
  - id: AudioService
    path: src/services/AudioService.ts
    risk_level: LOW
    description: Efectos sonoros compartidos para eventos y turnos

