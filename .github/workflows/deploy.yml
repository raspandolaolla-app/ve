name: Manual Fallback Deploy to GitHub Pages

# NOTA ARQUITECTÓNICA: La ruta oficial canónica de deployment automático en cada push
# está centralizada exclusivamente en `.github/workflows/main.yml`.
# Este workflow se conserva como respaldo de ejecución manual (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Web Application
        env:
          VITE_APP_BASE_PATH: './'
        run: npm run build

      - name: Copy 404 fallback for Single Page Application
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
