<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>
  
  <script type="module" src="/src/main.tsx"></script>
  
  <script>
    // Service Worker Registration con mejoras
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', function() {
        var swPath = './sw.js';
        navigator.serviceWorker.register(swPath).then(
          function(reg) {
            console.log('[PWA] Service Worker registrado correctamente en scope:', reg.scope);
            
            // Notificaciones Push
            if ('PushManager' in window) {
              console.log('[PWA] Push Notifications disponibles');
            }
            
            reg.onupdatefound = function() {
              var installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function() {
                  if (installingWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      console.log('[PWA] Nueva versión disponible; lista para actualizar.');
                      // Mostrar modal de actualización aquí si lo deseas
                    } else {
                      console.log('[PWA] Service Worker instalado por primera vez.');
                    }
                  }
                };
              }
            };
          },
          function(err) {
            console.warn('[PWA] Service Worker no registrado (modo WebApp activo):', err);
          }
        ).catch(function(err) {
          console.warn('[PWA] Excepción al registrar Service Worker:', err);
        });
      });
    }

    // Solicitar permisos de notificación al cargar
    window.addEventListener('load', function() {
      if ('Notification' in window && Notification.permission === 'default') {
        setTimeout(function() {
          Notification.requestPermission().then(function(permission) {
            if (permission === 'granted') {
              console.log('[PWA] Permiso de notificaciones otorgado');
            }
          });
        }, 5000); // Esperar 5 segundos antes de solicitar
      }
    });

    // Prevenir zoom en iOS con doble tap
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

    // Mejorar rendimiento en móviles
    document.addEventListener('touchmove', function(e) {
      if (e.target.closest('.no-scroll')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
