  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          var swPath = './sw.js';
          navigator.serviceWorker.register(swPath).then(
            function(reg) {
              console.log('[PWA] Service Worker registrado correctamente en scope:', reg.scope);
              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Nueva versión disponible; lista para actualizar.');
                    }
                  };
                }
              };
            },
            function(err) {
              console.warn('[PWA] Service Worker no registrado (modo WebApp activo):', err);
            }
          ).catch(function(err) {
            console.warn('[PWA] Excepción al registrar Service Worker:', err);
          });
        });
      }
    </script>
  </body>
