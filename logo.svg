<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Background Card Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1022" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="outerGoldGrad" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="potGrad" x1="120" y1="120" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="40%" stop-color="#7F1D1D" />
      <stop offset="75%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#450A0A" />
    </linearGradient>

    <linearGradient id="potLidGrad" x1="220" y1="80" x2="440" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="150" y1="150" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="spoonGrad" x1="160" y1="360" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <radialGradient id="glowGlow" cx="250" cy="250" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#B91C1C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect width="500" height="500" rx="64" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="484" height="484" rx="56" stroke="url(#outerGoldGrad)" stroke-width="6" fill="none" opacity="0.9" />
  <circle cx="250" cy="250" r="220" fill="url(#glowGlow)" />

  <!-- Steam Rising -->
  <g opacity="0.85">
    <path d="M 210 130 C 200 90 220 70 210 40" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 240 120 C 230 80 250 55 240 30" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M 270 135 C 260 95 280 75 270 45" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- MAIN OLLA (POT) BODY & HANDLES -->
  <g filter="url(#dropShadow)">
    <!-- Left Handle -->
    <path d="M 65 240 C 35 240 35 290 65 290 Z" fill="#581C87" stroke="url(#outerGoldGrad)" stroke-width="4" />
    <ellipse cx="60" cy="265" rx="8" ry="16" fill="#1e1022" />

    <!-- Right Handle -->
    <path d="M 435 240 C 465 240 465 290 435 290 Z" fill="#581C87" stroke="url(#outerGoldGrad)" stroke-width="4" />
    <ellipse cx="440" cy="265" rx="8" ry="16" fill="#1e1022" />

    <!-- Main Pot Body -->
    <circle cx="250" cy="270" r="175" fill="url(#potGrad)" stroke="url(#outerGoldGrad)" stroke-width="7" />
    <circle cx="250" cy="270" r="162" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- POT LID (Tilted Right) -->
  <g filter="url(#dropShadow)" transform="rotate(18, 330, 140)">
    <!-- Lid Body -->
    <ellipse cx="320" cy="140" rx="135" ry="50" fill="url(#potLidGrad)" stroke="url(#outerGoldGrad)" stroke-width="5" />
    <ellipse cx="320" cy="132" rx="100" ry="30" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.5" />
    <!-- Lid Handle Knob -->
    <ellipse cx="320" cy="95" rx="22" ry="12" fill="url(#outerGoldGrad)" />
    <ellipse cx="320" cy="90" rx="18" ry="8" fill="#FFFBEB" opacity="0.7" />
  </g>

  <!-- PLAYING CARDS IN THE CENTER -->
  <g id="playing-cards" transform="translate(145, 185)" filter="url(#dropShadow)">
    <!-- Card 1: 10 Spades (Left tilt) -->
    <g transform="rotate(-22, 40, 60)">
      <rect x="0" y="0" width="54" height="78" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />
      <text x="6" y="16" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E293B">A♠</text>
      <path d="M 27 34 C 27 34 16 48 27 54 C 38 48 27 34 27 34 Z M 27 52 L 27 58 H 24 H 30 Z" fill="#0F172A" />
    </g>

    <!-- Card 2: King Diamonds -->
    <g transform="rotate(-10, 60, 60)">
      <rect x="20" y="-5" width="54" height="78" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />
      <text x="26" y="11" font-family="sans-serif" font-weight="bold" font-size="12" fill="#DC2626">K♦</text>
      <polygon points="47,25 57,38 47,51 37,38" fill="#DC2626" />
    </g>

    <!-- Card 3: Queen Clubs (Center) -->
    <g transform="rotate(2, 75, 60)">
      <rect x="42" y="-12" width="54" height="78" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />
      <text x="48" y="4" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1E293B">J♣</text>
      <circle cx="69" cy="22" r="6" fill="#0F172A" />
      <circle cx="62" cy="30" r="6" fill="#0F172A" />
      <circle cx="76" cy="30" r="6" fill="#0F172A" />
      <polygon points="69,28 66,39 72,39" fill="#0F172A" />
    </g>

    <!-- Card 4: Ace of Hearts/Cups (Right tilt) -->
    <g transform="rotate(16, 95, 60)">
      <rect x="65" y="-10" width="54" height="78" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />
      <text x="71" y="6" font-family="sans-serif" font-weight="bold" font-size="12" fill="#DC2626">A🏆</text>
      <!-- Cup/Copa icon -->
      <path d="M 85 24 H 99 L 97 38 C 95 44 89 44 87 38 Z M 92 42 V 49 M 86 49 H 98" stroke="#DC2626" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- GOLDEN DICE (Left Side) -->
  <g transform="translate(170, 240)" filter="url(#dropShadow)">
    <!-- Die 1 -->
    <g transform="rotate(-12)">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="url(#outerGoldGrad)" stroke="#78350F" stroke-width="1.5" />
      <circle cx="8" cy="8" r="2.5" fill="#450A0A" />
      <circle cx="22" cy="8" r="2.5" fill="#450A0A" />
      <circle cx="15" cy="15" r="2.5" fill="#450A0A" />
      <circle cx="8" cy="22" r="2.5" fill="#450A0A" />
      <circle cx="22" cy="22" r="2.5" fill="#450A0A" />
    </g>
    <!-- Die 2 -->
    <g transform="translate(24, 10) rotate(18)">
      <rect x="0" y="0" width="28" height="28" rx="5" fill="url(#outerGoldGrad)" stroke="#78350F" stroke-width="1.5" />
      <circle cx="7" cy="7" r="2.2" fill="#450A0A" />
      <circle cx="21" cy="21" r="2.2" fill="#450A0A" />
      <circle cx="14" cy="14" r="2.2" fill="#450A0A" />
    </g>
  </g>

  <!-- BINGO & ANIMALITO SPHERES (Bottom center of Olla) -->
  <g id="bingo-spheres" transform="translate(175, 300)" filter="url(#dropShadow)">
    <!-- Sphere 1: 35 N -->
    <g transform="translate(0, 5)">
      <circle cx="20" cy="20" r="18" fill="url(#spoonGrad)" stroke="#78350F" stroke-width="2" />
      <circle cx="16" cy="14" r="12" fill="#FFFBEB" opacity="0.9" />
      <text x="16" y="18" font-family="sans-serif" font-weight="900" font-size="9" fill="#78350F" text-anchor="middle">35</text>
      <text x="16" y="24" font-family="sans-serif" font-weight="bold" font-size="6" fill="#92400E" text-anchor="middle">N</text>
    </g>

    <!-- Sphere 2: 51 G -->
    <g transform="translate(32, -8)">
      <circle cx="20" cy="20" r="19" fill="url(#spoonGrad)" stroke="#78350F" stroke-width="2" />
      <circle cx="16" cy="14" r="13" fill="#FFFBEB" opacity="0.9" />
      <text x="16" y="18" font-family="sans-serif" font-weight="900" font-size="10" fill="#78350F" text-anchor="middle">51</text>
      <text x="16" y="25" font-family="sans-serif" font-weight="bold" font-size="6.5" fill="#92400E" text-anchor="middle">G</text>
    </g>

    <!-- Sphere 3: Parrot 12 -->
    <g transform="translate(66, 0)">
      <circle cx="20" cy="20" r="18" fill="url(#spoonGrad)" stroke="#78350F" stroke-width="2" />
      <circle cx="16" cy="14" r="12" fill="#FFFBEB" opacity="0.9" />
      <!-- Parrot Silhouette -->
      <path d="M 12 12 Q 16 8 20 12 Q 18 18 14 17 Z" fill="#2563EB" />
      <text x="16" y="24" font-family="sans-serif" font-weight="bold" font-size="6" fill="#78350F" text-anchor="middle">12</text>
    </g>

    <!-- Sphere 4: Lion 15 -->
    <g transform="translate(10, 32)">
      <circle cx="20" cy="20" r="18" fill="url(#spoonGrad)" stroke="#78350F" stroke-width="2" />
      <circle cx="16" cy="14" r="12" fill="#FFFBEB" opacity="0.9" />
      <!-- Lion mane hint -->
      <circle cx="16" cy="14" r="5" fill="#D97706" />
      <text x="16" y="24" font-family="sans-serif" font-weight="bold" font-size="6" fill="#78350F" text-anchor="middle">15</text>
    </g>

    <!-- Sphere 5: Dog -->
    <g transform="translate(44, 32)">
      <circle cx="20" cy="20" r="19" fill="url(#spoonGrad)" stroke="#78350F" stroke-width="2" />
      <circle cx="16" cy="14" r="13" fill="#FFFBEB" opacity="0.9" />
      <!-- Dog face hint -->
      <path d="M 11 12 C 11 9 21 9 21 12 C 21 17 11 17 11 12 Z" fill="#92400E" />
      <text x="16" y="25" font-family="sans-serif" font-weight="bold" font-size="6.5" fill="#78350F" text-anchor="middle">🐶</text>
    </g>
  </g>

  <!-- GOLDEN WOODEN SPOON ("CUCHARA DE PALO / ORO") -->
  <g filter="url(#dropShadow)" transform="rotate(-6, 250, 370)">
    <!-- Handle -->
    <path d="M 150 380 Q 260 375 375 330" stroke="url(#spoonGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 150 380 Q 260 375 375 330" stroke="#FFFBEB" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <!-- Spoon Head -->
    <ellipse cx="382" cy="328" rx="22" ry="14" fill="url(#spoonGrad)" stroke="#78350F" stroke-width="2" transform="rotate(-25, 382, 328)" />
  </g>

  <!-- BRAND TYPOGRAPHY: "RASPANDO" (Top Arch) & "LA OLLA" (Bottom Arch) -->
  <path id="archTop" d="M 130 205 A 135 135 0 0 1 370 205" fill="none" />
  <path id="archBottom" d="M 125 315 A 145 145 0 0 0 375 315" fill="none" />

  <text font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="34" letter-spacing="3" fill="url(#goldTextGrad)" filter="url(#dropShadow)">
    <textPath href="#archTop" startOffset="50%" text-anchor="middle">
      RASPANDO
    </textPath>
  </text>

  <text font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="36" letter-spacing="4" fill="url(#goldTextGrad)" filter="url(#dropShadow)">
    <textPath href="#archBottom" startOffset="50%" text-anchor="middle">
      LA OLLA
    </textPath>
  </text>

  <!-- Decorative Gold Stars -->
  <g fill="#FFFBEB">
    <polygon points="250,140 252,145 257,145 253,148 255,153 250,150 245,153 247,148 243,145 248,145" opacity="0.8" />
    <polygon points="120,270 121,273 124,273 122,275 123,278 120,276 117,278 118,275 116,273 119,273" opacity="0.6" />
    <polygon points="380,270 381,273 384,273 382,275 383,278 380,276 377,278 378,275 376,273 379,273" opacity="0.6" />
  </g>
</svg>
