<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="atrapaitoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#2D1537" />
      <stop offset="100%" stop-color="#11071F" />
    </linearGradient>
    <linearGradient id="atrapaitoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#atrapaitoBg)" rx="20" />
  <rect x="3" y="3" width="1194" height="394" fill="none" stroke="#334155" stroke-width="2" rx="18" opacity="0.6" />

  <!-- Glows -->
  <circle cx="1020" cy="200" r="160" fill="#EC4899" opacity="0.14" />
  <circle cx="180" cy="200" r="120" fill="#F59E0B" opacity="0.1" />

  <!-- Left Side: Board and Dice tokens -->
  <g transform="translate(100, 90)">
    <!-- Board segment -->
    <rect x="10" y="10" width="190" height="190" rx="20" fill="#1F1133" stroke="#EC4899" stroke-width="3" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))" />
    <!-- Cross paths -->
    <rect x="80" y="15" width="50" height="180" fill="#3B1D54" />
    <rect x="15" y="80" width="180" height="50" fill="#3B1D54" />
    <!-- Central safe zone -->
    <circle cx="105" cy="105" r="30" fill="#EC4899" />
    <!-- Dice Token -->
    <circle cx="70" cy="70" r="16" fill="#F59E0B" stroke="#FFF" stroke-width="2" />
    <circle cx="140" cy="70" r="16" fill="#10B981" stroke="#FFF" stroke-width="2" />
    <circle cx="70" cy="140" r="16" fill="#3B82F6" stroke="#FFF" stroke-width="2" />
    <circle cx="140" cy="140" r="16" fill="#EF4444" stroke="#FFF" stroke-width="2" />
  </g>

  <!-- Right Side: Content -->
  <g transform="translate(380, 0)">
    <!-- Badge -->
    <rect x="0" y="70" width="240" height="32" rx="16" fill="#500724" stroke="#EC4899" stroke-width="1.5" />
    <text x="120" y="91" fill="#F472B6" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">
      PARCHÍS CRIOLLO 4 JUGADORES
    </text>

    <!-- Main Title -->
    <text x="0" y="165" fill="url(#atrapaitoGrad)" font-family="system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="1">
      ¡ATRAPAÍTO!
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">
      Come Fichas, Entra al Cielo y Cobra la Olla
    </text>

    <!-- Description -->
    <text x="0" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
      Bloqueos, barreras y captura sin piedad en partidas rápidas de 2 a 4 jugadores.
    </text>

    <!-- Action Tag -->
    <rect x="0" y="295" width="200" height="42" rx="12" fill="#DB2777" />
    <text x="100" y="322" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle">
      TIRAR LOS DADOS →
    </text>
  </g>
</svg>
