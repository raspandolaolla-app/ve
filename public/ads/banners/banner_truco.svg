<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="trucoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="50%" stop-color="#1B172E" />
      <stop offset="100%" stop-color="#0A0C14" />
    </linearGradient>
    <linearGradient id="trucoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#trucoBg)" rx="20" />
  <rect x="3" y="3" width="1194" height="394" fill="none" stroke="#475569" stroke-width="2" rx="18" opacity="0.5" />

  <!-- Glows -->
  <circle cx="1020" cy="200" r="160" fill="#A855F7" opacity="0.15" />
  <circle cx="200" cy="200" r="140" fill="#F43F5E" opacity="0.1" />

  <!-- Left Side: Playing Cards (Baraja Española) -->
  <g transform="translate(110, 95)">
    <!-- Card 1 -->
    <g transform="rotate(-15, 60, 100)">
      <rect width="115" height="190" rx="10" fill="#FFFDF8" stroke="#E2E8F0" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.6))" />
      <rect x="8" y="8" width="99" height="174" rx="6" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2" />
      <text x="22" y="38" fill="#DC2626" font-family="system-ui, sans-serif" font-size="22" font-weight="900">1</text>
      <!-- Espada symbol -->
      <path d="M57 60 L57 140 M45 80 L70 80 M52 140 L63 140" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
      <circle cx="57" cy="50" r="8" fill="#1E293B" />
      <text x="60" y="175" fill="#DC2626" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">ESPADILLA</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(80, 10) rotate(15, 60, 100)">
      <rect width="115" height="190" rx="10" fill="#FFFDF8" stroke="#E2E8F0" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.6))" />
      <rect x="8" y="8" width="99" height="174" rx="6" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2" />
      <text x="22" y="38" fill="#DC2626" font-family="system-ui, sans-serif" font-size="22" font-weight="900">7</text>
      <!-- Oro symbol -->
      <circle cx="57" cy="100" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="3" />
      <circle cx="57" cy="100" r="18" fill="none" stroke="#FEF3C7" stroke-width="2" />
      <text x="60" y="175" fill="#DC2626" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">MANILLA</text>
    </g>
  </g>

  <!-- Right Side: Content -->
  <g transform="translate(390, 0)">
    <!-- Badge -->
    <rect x="0" y="70" width="230" height="32" rx="16" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5" />
    <text x="115" y="91" fill="#C084FC" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle">
      ¡QUIERO VALE CUATRO!
    </text>

    <!-- Main Title -->
    <text x="0" y="165" fill="url(#trucoGrad)" font-family="system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="1">
      TRUCO VENEZOLANO
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">
      Envite, Vira, Flor y Ley del Juego
    </text>

    <!-- Description -->
    <text x="0" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
      Canta truco, retruco y vale cuatro. Mesas multijugador con señas y chat en vivo.
    </text>

    <!-- Action Tag -->
    <rect x="0" y="295" width="200" height="42" rx="12" fill="#A855F7" />
    <text x="100" y="322" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle">
      JUGAR TRUCO →
    </text>
  </g>
</svg>
