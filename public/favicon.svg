<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="favPotGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
    <linearGradient id="favGold" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Background Icon Frame -->
  <rect width="128" height="128" rx="28" fill="#090D16" />
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="url(#favGold)" stroke-width="3" fill="none" opacity="0.8" />

  <!-- Steam -->
  <path d="M 52 32 C 48 22 56 16 52 8" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 64 28 C 60 18 68 12 64 4" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 76 32 C 72 22 80 16 76 8" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Pot Handles -->
  <path d="M 14 62 C 6 62 6 78 14 78 Z" fill="#4C0519" stroke="url(#favGold)" stroke-width="1.5" />
  <path d="M 114 62 C 122 62 122 78 114 78 Z" fill="#4C0519" stroke="url(#favGold)" stroke-width="1.5" />

  <!-- Main Pot Body -->
  <circle cx="64" cy="72" r="46" fill="url(#favPotGrad)" stroke="url(#favGold)" stroke-width="3.5" />

  <!-- Tilted Lid -->
  <ellipse cx="80" cy="40" rx="34" ry="13" fill="url(#favPotGrad)" stroke="url(#favGold)" stroke-width="2.5" transform="rotate(16, 80, 40)" />
  <ellipse cx="80" cy="28" rx="6" ry="3.5" fill="url(#favGold)" transform="rotate(16, 80, 28)" />

  <!-- Spoon Scrape -->
  <path d="M 38 98 Q 66 96 98 84" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round" fill="none" />
  <ellipse cx="99" cy="83" rx="6" ry="4" fill="url(#favGold)" transform="rotate(-20, 99, 83)" />

  <!-- Center Card/Star Highlight -->
  <polygon points="64,56 65.5,60 70,60 66.5,62.5 68,66.5 64,64 60,66.5 61.5,62.5 58,60 62.5,60" fill="#FFFBEB" />
</svg>
