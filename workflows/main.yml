name: Deploy Raspando La Olla to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify Environment Variables Safely (No Secret Values Logged)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://tncxgwycinbnkjbfwojt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL || 'https://raspandolaolla-app.github.io' }}
          VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH || secrets.VITE_APP_BASE_PATH || '/ve/' }}
        run: |
          echo "=== DIAGNÓSTICO SEGURO DE VARIABLES PÚBLICAS ==="
          [ -n "$VITE_SUPABASE_URL" ] && echo "VITE_SUPABASE_URL = PRESENT" || echo "VITE_SUPABASE_URL = MISSING"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "VITE_SUPABASE_ANON_KEY = PRESENT" || echo "VITE_SUPABASE_ANON_KEY = MISSING"
          [ -n "$VITE_APP_URL" ] && echo "VITE_APP_URL = PRESENT" || echo "VITE_APP_URL = MISSING"
          [ -n "$VITE_APP_BASE_PATH" ] && echo "VITE_APP_BASE_PATH = PRESENT" || echo "VITE_APP_BASE_PATH = MISSING"
          echo "==============================================="

      - name: Run TypeScript typecheck
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://tncxgwycinbnkjbfwojt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL || 'https://raspandolaolla-app.github.io' }}
          VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH || secrets.VITE_APP_BASE_PATH || '/ve/' }}
        run: npm run typecheck

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://tncxgwycinbnkjbfwojt.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || secrets.VITE_APP_URL || 'https://raspandolaolla-app.github.io' }}
          VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH || secrets.VITE_APP_BASE_PATH || '/ve/' }}
        run: npm run build

      - name: Copy 404 fallback for Single Page Application
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
